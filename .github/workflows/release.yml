name: release

# Builds both MCP images for amd64 + arm64, pushes them to GHCR tagged with the commit,
# then points deploy/ at the new tags. Flux on the cluster picks the commit up.
on:
  push:
    branches: [main]
    paths: [packages/**, package-lock.json, Dockerfile]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [mcp-zenmoney, mcp-zerro]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: APP=${{ matrix.app }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.app }}:${{ github.sha }}
          push: true

  deploy:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # kustomize is preinstalled on GitHub's ubuntu runners.
      - name: Point deploy/ at the new images
        run: |
          cd deploy
          for app in mcp-zenmoney mcp-zerro; do
            kustomize edit set image "$app=ghcr.io/${{ github.repository_owner }}/$app:${{ github.sha }}"
          done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: ${GITHUB_SHA::7}"
          git push
